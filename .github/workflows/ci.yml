name: AdminForge CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Core boundary
        run: npm run test:core-boundaries
      - name: DataGrid Core tests
        run: npm run test:data-grid
      - name: Build development
        run: npm run build -- --configuration development
