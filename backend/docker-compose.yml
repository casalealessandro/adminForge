services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adminforge
      POSTGRES_USER: adminforge
      POSTGRES_PASSWORD: adminforge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adminforge -d adminforge"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - adminforge_postgres_data:/var/lib/postgresql/data

volumes:
  adminforge_postgres_data:
