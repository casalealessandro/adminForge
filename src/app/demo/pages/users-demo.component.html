<section class="demo-page">
  <div class="demo-page__header">
    <div>
      <span class="demo-page__eyebrow">REST provider demo</span>
      <h1>Users</h1>
      <p>Server-side paging, global search and sorting through the neutral GridDataProvider contract.</p>
    </div>
    <span class="demo-page__badge">/api/users</span>
  </div>

  <app-data-grid
    [idTable]="'adminforge-users'"
    [colonne]="columns"
    [dataProvider]="provider"
    [remoteOperation]="true"
    [showToolbarTop]="true"
    [showFilter]="false"
    [tableHeight]="540">
  </app-data-grid>
</section>
